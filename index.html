<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laya Car Game</title>
    <style>
      :root {
        --bg: #081421;
        --panel: #0d1b2a;
        --road: #232d38;
        --lane: rgba(255,255,255,0.45);
        --car: #f8b84e;
        --car-dark: #d97706;
        --obstacle: #ff5d5d;
        --obstacle-2: #f4d35e;
        --safe: #7bdff2;
        --text: #ecf4ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #15314b 0%, #081421 52%, #040b12 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        width: min(94vw, 760px);
        background: rgba(8, 18, 30, 0.9);
        border: 2px solid rgba(123, 223, 242, 0.25);
        border-radius: 18px;
        padding: 18px 18px 14px;
        box-shadow: 0 16px 44px rgba(0,0,0,0.35);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .title {
        font-size: clamp(1.35rem, 2vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .stats {
        display: flex;
        gap: 12px;
        font-size: 0.96rem;
      }

      .pill {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(123, 223, 242, 0.3);
        background: rgba(123, 223, 242, 0.08);
      }

      .canvas-wrap {
        display: flex;
        justify-content: center;
      }

      canvas {
        width: min(100%, 540px);
        height: auto;
        display: block;
        border-radius: 16px;
        border: 2px solid rgba(255,255,255,0.06);
        background: linear-gradient(180deg, #25384d 0%, #171f28 100%);
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: linear-gradient(180deg, #7bdff2, #57c3df);
        color: #062534;
        font-size: 1rem;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(87, 195, 223, 0.25);
      }

      button:hover { filter: brightness(1.05); }

      .status {
        min-height: 28px;
        text-align: center;
        margin-top: 12px;
        font-weight: 700;
        color: var(--safe);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="title">Laya Driver</div>
        <div class="stats">
          <div class="pill">Score: <span id="score">0</span></div>
          <div class="pill">Lives: <span id="lives">3</span></div>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="540" height="720"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn">Start Race</button>
      </div>

      <div id="status" class="status">Ready</div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');

      const lanes = 3;
      const roadWidth = 330;
      const laneWidth = roadWidth / lanes;
      const roadX = (canvas.width - roadWidth) / 2;
      const carWidth = 56;
      const carHeight = 92;
      const obstacleWidth = 52;
      const obstacleHeight = 82;
      const carY = canvas.height - 130;
      const tickMs = 850;

      let gameState = null;
      let moveTimer = null;

      function getCarX(lane) {
        return roadX + lane * laneWidth + (laneWidth - carWidth) / 2;
      }

      function getObstacleX(lane) {
        return roadX + lane * laneWidth + (laneWidth - obstacleWidth) / 2;
      }

      function resetGame() {
        gameState = {
          score: 0,
          lives: 3,
          carLane: 1,
          obstacles: [],
          running: false,
          gameOver: false,
          speed: 5,
        };
        scoreEl.textContent = '0';
        livesEl.textContent = '3';
        statusEl.textContent = 'Ready';
      }

      function placeObstacle() {
        if (!gameState || !gameState.running) return;

        const lane = Math.floor(Math.random() * lanes);
        const obstacleType = Math.random() > 0.5 ? 'traffic' : 'cone';

        gameState.obstacles.push({
          lane,
          y: -obstacleHeight,
          type: obstacleType,
          speed: 5 + Math.random() * 4 + gameState.speed * 0.18,
        });
      }

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#183450');
        sky.addColorStop(0.42, '#1a2d3c');
        sky.addColorStop(1, '#0b1118');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const glow = ctx.createRadialGradient(canvas.width / 2, 140, 20, canvas.width / 2, 140, 220);
        glow.addColorStop(0, 'rgba(255, 206, 124, 0.95)');
        glow.addColorStop(0.2, 'rgba(255, 178, 92, 0.7)');
        glow.addColorStop(1, 'rgba(255, 178, 92, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 26; i++) {
          const x = (i * 51 + 20) % canvas.width;
          const y = 40 + (i * 37) % 160;
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillRect(x, y, 2, 2);
        }
      }

      function drawRoad() {
        const shoulder = ctx.createLinearGradient(roadX - 18, 0, roadX + roadWidth + 18, 0);
        shoulder.addColorStop(0, '#1a2026');
        shoulder.addColorStop(0.5, '#2b3138');
        shoulder.addColorStop(1, '#1a2026');
        ctx.fillStyle = shoulder;
        ctx.fillRect(roadX - 24, 0, roadWidth + 48, canvas.height);

        ctx.fillStyle = '#343d46';
        ctx.fillRect(roadX, 0, roadWidth, canvas.height);

        for (let i = 0; i <= 12; i++) {
          const y = (i * 70 + (canvas.height * 0.08)) % (canvas.height + 80);
          ctx.fillStyle = '#f6f7fb';
          ctx.fillRect(roadX + laneWidth - 4, y, 8, 52);
          ctx.fillRect(roadX + laneWidth * 2 - 4, y, 8, 52);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(roadX - 18, 0, 12, canvas.height);
        ctx.fillRect(roadX + roadWidth + 6, 0, 12, canvas.height);

        for (let i = 0; i < 10; i++) {
          const sideX = i % 2 === 0 ? roadX - 28 : roadX + roadWidth + 16;
          const lightY = (i * 90 + (canvas.height * 0.15)) % (canvas.height + 80);
          ctx.fillStyle = i % 2 === 0 ? '#ffde59' : '#8fe7ff';
          ctx.fillRect(sideX, lightY, 8, 22);
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 3;
        ctx.strokeRect(roadX, 0, roadWidth, canvas.height);
      }

      function drawCar(x, y) {
        ctx.save();
        ctx.shadowColor = 'rgba(248, 184, 78, 0.6)';
        ctx.shadowBlur = 18;

        ctx.fillStyle = '#f8b84e';
        ctx.fillRect(x, y, carWidth, carHeight);

        ctx.fillStyle = '#ffcf5a';
        ctx.fillRect(x + 10, y + 8, carWidth - 20, 20);
        ctx.fillStyle = '#1b2430';
        ctx.fillRect(x + 12, y + 10, 10, 18);
        ctx.fillRect(x + carWidth - 22, y + 10, 10, 18);

        ctx.fillStyle = '#0d1117';
        ctx.fillRect(x + 10, y + carHeight - 18, 10, 14);
        ctx.fillRect(x + carWidth - 20, y + carHeight - 18, 10, 14);

        ctx.fillStyle = '#f7f2d0';
        ctx.fillRect(x + 5, y + 24, 8, 12);
        ctx.fillRect(x + carWidth - 13, y + 24, 8, 12);
        ctx.restore();
      }

      function drawObstacle(obstacle) {
        const x = getObstacleX(obstacle.lane);
        const y = obstacle.y;

        if (obstacle.type === 'traffic') {
          ctx.save();
          ctx.shadowColor = 'rgba(255, 93, 93, 0.5)';
          ctx.shadowBlur = 14;
          ctx.fillStyle = '#ff5d5d';
          ctx.fillRect(x, y, obstacleWidth, obstacleHeight);
          ctx.fillStyle = '#ffd166';
          ctx.fillRect(x + 8, y + 12, obstacleWidth - 16, 16);
          ctx.fillStyle = '#1f2b36';
          ctx.fillRect(x + 8, y + obstacleHeight - 15, 10, 12);
          ctx.fillRect(x + obstacleWidth - 18, y + obstacleHeight - 15, 10, 12);
          ctx.restore();
        } else {
          ctx.save();
          ctx.shadowColor = 'rgba(244, 211, 94, 0.5)';
          ctx.shadowBlur = 14;
          ctx.fillStyle = '#f4d35e';
          ctx.fillRect(x + 10, y + 20, obstacleWidth - 20, obstacleHeight - 24);
          ctx.beginPath();
          ctx.moveTo(x + 5, y + obstacleHeight - 8);
          ctx.lineTo(x + obstacleWidth / 2, y + 8);
          ctx.lineTo(x + obstacleWidth - 5, y + obstacleHeight - 8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function draw() {
        drawSky();
        drawRoad();

        const carX = getCarX(gameState.carLane);
        drawCar(carX, carY);

        for (const obstacle of gameState.obstacles) {
          drawObstacle(obstacle);
        }
      }

      async function requestDecision() {
        if (!gameState || !gameState.running || gameState.gameOver) return;

        const payload = {
          carLane: gameState.carLane,
          obstacles: gameState.obstacles.map(o => ({ lane: o.lane, y: o.y }))
        };

        try {
          const res = await fetch('/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (data && data.decision) {
            if (data.decision === 'left' && gameState.carLane > 0) {
              gameState.carLane -= 1;
            }
            if (data.decision === 'right' && gameState.carLane < lanes - 1) {
              gameState.carLane += 1;
            }
            statusEl.textContent = `Laya chose: ${data.decision}`;
          }
        } catch (err) {
          statusEl.textContent = 'Laya decision failed';
        }
      }

      function handleCollision() {
        const carX = getCarX(gameState.carLane);

        for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
          const obstacle = gameState.obstacles[i];
          const obstacleX = getObstacleX(obstacle.lane);
          const dx = Math.abs((obstacleX + obstacleWidth / 2) - (carX + carWidth / 2));
          const dy = Math.abs((obstacle.y + obstacleHeight / 2) - (carY + carHeight / 2));

          if (dx < (carWidth + obstacleWidth) / 2.1 && dy < (carHeight + obstacleHeight) / 2.2) {
            gameState.obstacles.splice(i, 1);
            gameState.lives -= 1;
            livesEl.textContent = String(gameState.lives);
            statusEl.textContent = 'Accident!';

            if (gameState.lives <= 0) {
              gameState.gameOver = true;
              gameState.running = false;
              statusEl.textContent = 'Crash! Game over';
              clearInterval(moveTimer);
            }
          }
        }
      }

      function updateFrame() {
        if (!gameState || !gameState.running || gameState.gameOver) {
          draw();
          return;
        }

        gameState.speed += 0.08;

        for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
          gameState.obstacles[i].y += gameState.obstacles[i].speed;

          if (gameState.obstacles[i].y > canvas.height + obstacleHeight) {
            gameState.obstacles.splice(i, 1);
            gameState.score += 1;
            scoreEl.textContent = String(gameState.score);
          }
        }

        handleCollision();
        draw();
      }

      function startGame() {
        resetGame();
        gameState.running = true;
        statusEl.textContent = 'Race live — avoid the crash';

        if (moveTimer) clearInterval(moveTimer);

        moveTimer = setInterval(() => {
          placeObstacle();
          requestDecision();
          updateFrame();
        }, tickMs);

        updateFrame();
      }

      document.addEventListener('keydown', (event) => {
        if (!gameState || !gameState.running || gameState.gameOver) return;

        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') {
          if (gameState.carLane > 0) gameState.carLane -= 1;
        }

        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') {
          if (gameState.carLane < lanes - 1) gameState.carLane += 1;
        }
      });

      startBtn.addEventListener('click', startGame);
      resetGame();
      draw();
    </script>
  </body>
</html>
